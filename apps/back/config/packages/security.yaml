security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            id: Application\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: member.login
                check_path: member.login
                enable_csrf: true
                default_target_path: group.index
            logout:
                path: member.logout
                target: member.login

    access_control:
        - { path: '^/', roles: }
        - { path: '^(/[a-z]{2})?/login', roles:  }
        - { path: '^(/[a-z]{2})?/register', roles:  }
        - { path: '^(/[a-z]{2})?/logout', roles:  }
        - { path: '^(/[a-z]{2})?/mentions-legales', roles:  }
        - { path: '^(/[a-z]{2})?/politique-de-confidentialite', roles:  }
        - { path: '^/', roles: ROLE_USER }


when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
